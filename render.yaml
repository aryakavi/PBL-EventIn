services:
  - type: web
    name: EventIn
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SUPABASE_URL
        value: https://aypwdgvqcizpsnccrfwc.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: image_event
      - key: SUPABASE_BUKTI_FOLDER
        value: bukti_pembayaran
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
